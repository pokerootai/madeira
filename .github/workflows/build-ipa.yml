      - name: Compile SwiftUI app for simulator
        run: |
          set -e
          cd app/Madeira
          TGT=arm64-apple-ios17.0-simulator
          xcrun -sdk iphonesimulator clang -target $TGT -c ../../sim/stubs.c -o ../../sim/stubs.o
          xcrun -sdk iphonesimulator clang -target $TGT -c ../../sim/stubs.m -o ../../sim/stubs_m.o
          xcrun -sdk iphonesimulator swiftc -target $TGT \
            -import-objc-header Madeira-Bridging-Header.h \
            -o ../../sim/MadeiraSim \
            MadeiraApp.swift ContentView.swift EntitlementChecker.swift FPSOverlay.swift \
            LogPattern.swift LogStore.swift LogTail.swift StikJITHelper.swift \
            ../../sim/stubs.o ../../sim/stubs_m.o 2>&1 | tail -30
          file ../../sim/MadeiraSim
      - name: Bundle + boot simulator + screenshot
        run: |
          set -e
          cd sim
          mkdir -p MadeiraSim.app
          cp MadeiraSim MadeiraSim.app/
          cat > MadeiraSim.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.madeira.sim</string>
            <key>CFBundleExecutable</key><string>MadeiraSim</string>
            <key>CFBundleName</key><string>MadeiraSim</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>17.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
          </dict>
          </plist>
          PLIST
          DEVTYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devicetypes']; ip=[x for x in d if x['productFamily']=='iPhone']; print(ip[-1]['identifier'])")
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=json.load(sys.stdin)['runtimes']; ios=[x for x in r if x['platform']=='iOS' and x.get('isAvailable')]; print(ios[-1]['identifier'])")
          echo "devtype=$DEVTYPE runtime=$RUNTIME"
          UDID=$(xcrun simctl create madeira-sim "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" MadeiraSim.app
          xcrun simctl launch "$UDID" com.madeira.sim || true
          sleep 10
          xcrun simctl io "$UDID" screenshot shot-portrait.png
          echo "--- screenshot done"
      - uses: actions/upload-artifact@v4
        with:
          name: sim-screenshots
          path: sim/shot-portrait.png
